<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transkripsi Audio Langsung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            color: #7f8c8d;
            font-weight: 400;
        }

        .controls-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        #recordButton {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.3);
        }

        #recordButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(238, 90, 36, 0.4);
        }

        #recordButton.recording {
            width: 220px;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 25px;
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.3);
        }

        #recordButton:active {
            transform: scale(0.95);
        }

        #recordButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .shape-container {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .shape {
            width: 30px;
            height: 30px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        #recordButton:disabled .shape {
            background-color: #bdc3c7;
        }

        #recordButton.recording .shape {
            border-radius: 6px;
            width: 30px;
            height: 30px;
        }

        .recording-info {
            display: none;
            align-items: center;
            margin-left: 20px;
            flex-grow: 1;
        }

        #recordButton.recording .recording-info {
            display: flex;
        }

        .wave-container {
            width: 70px;
            height: 35px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #waveCanvas {
            width: 100%;
            height: 100%;
        }

        .timer {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-left: 15px;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        #chunkSelector,
        #websocketInput {
            font-size: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #e1e8ed;
            background-color: #ffffff;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        #websocketInput {
            width: 100%;
        }

        #chunkSelector:focus,
        #websocketInput:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        #status {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .transcript-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            max-height: 500px;
            overflow-y: auto;
        }

        .transcript-header {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        #linesTranscript {
            text-align: left;
            font-size: 16px;
            line-height: 1.6;
        }

        #linesTranscript p {
            margin: 0 0 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            border-left: 4px solid #3498db;
        }

        #speaker {
            border: 2px solid #3498db;
            border-radius: 25px;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-block;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .label_diarization {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border-radius: 12px;
            padding: 6px 12px;
            margin-left: 10px;
            display: inline-block;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 500;
        }

        .label_transcription {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border-radius: 12px;
            padding: 6px 12px;
            display: inline-block;
            white-space: nowrap;
            margin-left: 10px;
            font-size: 12px;
            font-weight: 500;
        }

        #timeInfo {
            color: #7f8c8d;
            margin-left: 10px;
            font-size: 12px;
        }

        .textcontent {
            font-size: 16px;
            padding-left: 10px;
            margin-bottom: 10px;
            margin-top: 8px;
            border-radius: 0 0 0 12px;
            color: #2c3e50;
        }

        .buffer_diarization {
            color: #e74c3c;
            margin-left: 4px;
            font-style: italic;
        }

        .buffer_transcription {
            color: #f39c12;
            margin-left: 4px;
            font-style: italic;
        }

        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-bottom: 2px;
            margin-right: 5px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .silence {
            color: #7f8c8d;
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
            font-size: 13px;
            border-radius: 20px;
            padding: 6px 15px;
            font-weight: 500;
        }

        .loading {
            color: #ffffff;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 13px;
            margin-bottom: 0px;
            font-weight: 500;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls-section {
                flex-direction: column;
                gap: 20px;
            }

            #recordButton.recording {
                width: 200px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Custom scrollbar */
        .transcript-container::-webkit-scrollbar {
            width: 8px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Transkripsi Audio Langsung</h1>
            <p>Klik tombol untuk memulai transkripsi audio real-time</p>
        </div>

        <div class="controls-section">
            <button id="recordButton">
                <div class="shape-container">
                    <div class="shape"></div>
                </div>
                <div class="recording-info">
                    <div class="wave-container">
                        <canvas id="waveCanvas"></canvas>
                    </div>
                    <div class="timer">00:00</div>
                </div>
            </button>
            
            <div class="settings-panel">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label for="chunkSelector">Ukuran Chunk (ms):</label>
                        <select id="chunkSelector">
                            <option value="500">500 ms</option>
                            <option value="1000" selected>1000 ms</option>
                            <option value="2000">2000 ms</option>
                            <option value="3000">3000 ms</option>
                            <option value="4000">4000 ms</option>
                            <option value="5000">5000 ms</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="websocketInput">URL WebSocket:</label>
                        <input id="websocketInput" type="text" />
                    </div>
                </div>
            </div>
        </div>

        <div id="status">Klik tombol untuk memulai transkripsi</div>

        <div class="transcript-container">
            <div class="transcript-header">📝 Hasil Transkripsi</div>
            <div id="linesTranscript"></div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let websocket = null;
        let recorder = null;
        let chunkDuration = 1000;
        let websocketUrl = "ws://localhost:8000/asr";
        let userClosing = false;
        let startTime = null;
        let timerInterval = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let waveCanvas = document.getElementById("waveCanvas");
        let waveCtx = waveCanvas.getContext("2d");
        let animationFrame = null;
        let waitingForStop = false;
        let lastReceivedData = null;
        waveCanvas.width = 70 * (window.devicePixelRatio || 1);
        waveCanvas.height = 35 * (window.devicePixelRatio || 1);
        waveCtx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

        const statusText = document.getElementById("status");
        const recordButton = document.getElementById("recordButton");
        const chunkSelector = document.getElementById("chunkSelector");
        const websocketInput = document.getElementById("websocketInput");
        const linesTranscriptDiv = document.getElementById("linesTranscript");
        const timerElement = document.querySelector(".timer");

        const host = window.location.hostname || "localhost";
        const port = window.location.port;
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const defaultWebSocketUrl = `${protocol}://${host}:${port}/asr`;
        websocketInput.value = defaultWebSocketUrl;
        websocketUrl = defaultWebSocketUrl;

        chunkSelector.addEventListener("change", () => {
            chunkDuration = parseInt(chunkSelector.value);
        });

        websocketInput.addEventListener("change", () => {
            const urlValue = websocketInput.value.trim();
            if (!urlValue.startsWith("ws://") && !urlValue.startsWith("wss://")) {
                statusText.textContent = "URL WebSocket tidak valid (harus dimulai dengan ws:// atau wss://)";
                return;
            }
            websocketUrl = urlValue;
            statusText.textContent = "URL WebSocket diperbarui. Siap untuk terhubung.";
        });

        function setupWebSocket() {
            return new Promise((resolve, reject) => {
                try {
                    websocket = new WebSocket(websocketUrl);
                } catch (error) {
                    statusText.textContent = "URL WebSocket tidak valid. Silakan periksa dan coba lagi.";
                    reject(error);
                    return;
                }

                websocket.onopen = () => {
                    statusText.textContent = "Terhubung ke server.";
                    resolve();
                };

                websocket.onclose = () => {
                    if (userClosing) {
                        if (waitingForStop) {
                            statusText.textContent = "Pemrosesan selesai atau koneksi ditutup.";
                            if (lastReceivedData) {
                                renderLinesWithBuffer(
                                    lastReceivedData.lines || [],
                                    lastReceivedData.buffer_diarization || "",
                                    lastReceivedData.buffer_transcription || "",
                                    0, 0, true // isFinalizing = true
                                );
                            }
                        }
                    } else {
                        statusText.textContent = "Terputus dari server WebSocket. (Periksa log jika model sedang dimuat.)";
                        if (isRecording) {
                            stopRecording(); 
                        }
                    }
                    isRecording = false;  
                    waitingForStop = false; 
                    userClosing = false;  
                    lastReceivedData = null;  
                    websocket = null;    
                    updateUI();  
                };

                websocket.onerror = () => {
                    statusText.textContent = "Error saat menghubungkan ke WebSocket.";
                    reject(new Error("Error connecting to WebSocket"));
                };

                // Handle messages from server
                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    // Check for status messages
                    if (data.type === "ready_to_stop") {
                        console.log("Ready to stop received, finalizing display and closing WebSocket.");
                        waitingForStop = false;

                        if (lastReceivedData) {
                            renderLinesWithBuffer(
                                lastReceivedData.lines || [],
                                lastReceivedData.buffer_diarization || "",
                                lastReceivedData.buffer_transcription || "",
                                0, // No more lag
                                0, // No more lag
                                true // isFinalizing = true
                            );
                        }
                        statusText.textContent = "Pemrosesan audio selesai! Siap untuk merekam lagi.";
                        recordButton.disabled = false;
                        
                        if (websocket) {
                            websocket.close(); // will trigger onclose
                        }
                        return;
                    }
                    
                    lastReceivedData = data; 
                    
                    // Handle normal transcription updates
                    const { 
                        lines = [], 
                        buffer_transcription = "", 
                        buffer_diarization = "",
                        remaining_time_transcription = 0,
                        remaining_time_diarization = 0,
                        status = "active_transcription"
                    } = data;
                    
                    renderLinesWithBuffer(
                        lines, 
                        buffer_diarization, 
                        buffer_transcription, 
                        remaining_time_diarization,
                        remaining_time_transcription,
                        false,
                        status
                    );
                };
            });
        }

        function renderLinesWithBuffer(lines, buffer_diarization, buffer_transcription, remaining_time_diarization, remaining_time_transcription, isFinalizing = false, current_status = "active_transcription") {
            if (current_status === "no_audio_detected") {
                linesTranscriptDiv.innerHTML = "<p style='text-align: center; color: #7f8c8d; margin-top: 20px; font-style: italic;'>Tidak ada audio terdeteksi...</p>";
                return; 
            }

            const linesHtml = lines.map((item, idx) => {
                let timeInfo = "";
                if (item.beg !== undefined && item.end !== undefined) {
                    timeInfo = ` ${item.beg} - ${item.end}`;
                }

                let speakerLabel = "";
                if (item.speaker === -2) {
                    speakerLabel = `<span class="silence">Diam<span id='timeInfo'>${timeInfo}</span></span>`;
                } else if (item.speaker == 0 && !isFinalizing) {
                    speakerLabel = `<span class='loading'><span class="spinner"></span><span id='timeInfo'>${remaining_time_diarization} detik audio sedang menjalani diarization</span></span>`;
                } else if (item.speaker == -1) {
                    speakerLabel = `<span id="speaker">Pembicara 1<span id='timeInfo'>${timeInfo}</span></span>`;
                } else if (item.speaker !== -1 && item.speaker !== 0) {
                    speakerLabel = `<span id="speaker">Pembicara ${item.speaker}<span id='timeInfo'>${timeInfo}</span></span>`;
                }

                let currentLineText = item.text || "";

                if (idx === lines.length - 1) { 
                    if (!isFinalizing) {
                        if (remaining_time_transcription > 0) {
                             speakerLabel += `<span class="label_transcription"><span class="spinner"></span>Lag transkripsi <span id='timeInfo'>${remaining_time_transcription}s</span></span>`;
                        }
                        if (buffer_diarization && remaining_time_diarization > 0) {
                             speakerLabel += `<span class="label_diarization"><span class="spinner"></span>Lag diarization<span id='timeInfo'>${remaining_time_diarization}s</span></span>`;
                        }
                    }

                    if (buffer_diarization) {
                        if (isFinalizing) {
                            currentLineText += (currentLineText.length > 0 && buffer_diarization.trim().length > 0 ? " " : "") + buffer_diarization.trim();
                        } else {
                            currentLineText += `<span class="buffer_diarization">${buffer_diarization}</span>`;
                        }
                    }
                    if (buffer_transcription) {
                        if (isFinalizing) {
                            currentLineText += (currentLineText.length > 0 && buffer_transcription.trim().length > 0 ? " " : "") + buffer_transcription.trim();
                        } else {
                            currentLineText += `<span class="buffer_transcription">${buffer_transcription}</span>`;
                        }
                    }
                }
                
                return currentLineText.trim().length > 0 || speakerLabel.length > 0
                    ? `<p>${speakerLabel}<br/><div class='textcontent'>${currentLineText}</div></p>`
                    : `<p>${speakerLabel}<br/></p>`; 
            }).join("");

            linesTranscriptDiv.innerHTML = linesHtml;
        }

        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, "0");
            const seconds = (elapsed % 60).toString().padStart(2, "0");
            timerElement.textContent = `${minutes}:${seconds}`;
        }

        function drawWaveform() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);
            
            waveCtx.clearRect(0, 0, waveCanvas.width / (window.devicePixelRatio || 1), waveCanvas.height / (window.devicePixelRatio || 1));
            waveCtx.lineWidth = 2;
            waveCtx.strokeStyle = '#ffffff';
            waveCtx.beginPath();
            
            const sliceWidth = (waveCanvas.width / (window.devicePixelRatio || 1)) / bufferLength;
            let x = 0;
            
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * (waveCanvas.height / (window.devicePixelRatio || 1)) / 2;
                
                if (i === 0) {
                    waveCtx.moveTo(x, y);
                } else {
                    waveCtx.lineTo(x, y);
                }
                
                x += sliceWidth;
            }
            
            waveCtx.lineTo(waveCanvas.width / (window.devicePixelRatio || 1), waveCanvas.height / (window.devicePixelRatio || 1) / 2);
            waveCtx.stroke();
            
            animationFrame = requestAnimationFrame(drawWaveform);
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                recorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
                recorder.ondataavailable = (e) => {
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        websocket.send(e.data);
                    }
                };
                recorder.start(chunkDuration);
                
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                drawWaveform();
                
                isRecording = true;
                updateUI();
            } catch (err) {
                statusText.textContent = "Error mengakses mikrofon. Silakan izinkan akses mikrofon.";
                console.error(err);
            }
        }

        async function stopRecording() {
            userClosing = true;
            waitingForStop = true;
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                // Send empty audio buffer as stop signal
                const emptyBlob = new Blob([], { type: 'audio/webm' });
                websocket.send(emptyBlob);
                statusText.textContent = "Rekaman dihentikan. Memproses audio terakhir...";
            }
            
            if (recorder) {
                recorder.stop();
                recorder = null;
            }
            
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            
            if (analyser) {
                analyser = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                try {
                    audioContext.close();
                } catch (e) {
                    console.warn("Could not close audio context:", e);
                }
                audioContext = null;
            }
            
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }            
            timerElement.textContent = "00:00";
            startTime = null;
            
            isRecording = false;
            updateUI();	
        }

        async function toggleRecording() {
            if (!isRecording) {
                if (waitingForStop) {
                    console.log("Waiting for stop, early return");
                    return;  // Early return, UI is already updated
                }
                console.log("Connecting to WebSocket");
                try {
                    // If we have an active WebSocket that's still processing, just restart audio capture
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        await startRecording();
                    } else {
                        // If no active WebSocket or it's closed, create new one
                        await setupWebSocket();
                        await startRecording();
                    }
                } catch (err) {
                    statusText.textContent = "Tidak dapat terhubung ke WebSocket atau mengakses mikrofon. Dibatalkan.";
                    console.error(err);
                }
            } else {
                console.log("Stopping recording");
                stopRecording();
            }
        }

        function updateUI() {
            recordButton.classList.toggle("recording", isRecording);
            recordButton.disabled = waitingForStop;

            if (waitingForStop) {
                if (statusText.textContent !== "Rekaman dihentikan. Memproses audio terakhir...") {
                     statusText.textContent = "Silakan tunggu pemrosesan selesai...";
                }
            } else if (isRecording) {
                statusText.textContent = "Sedang merekam...";
            } else {
                if (statusText.textContent !== "Pemrosesan audio selesai! Siap untuk merekam lagi." &&
                    statusText.textContent !== "Pemrosesan selesai atau koneksi ditutup.") {
                    statusText.textContent = "Klik untuk memulai transkripsi";
                }
            }
            if (!waitingForStop) {
                recordButton.disabled = false;
            }
        }

        recordButton.addEventListener("click", toggleRecording);
    </script>
</body>

</html>
