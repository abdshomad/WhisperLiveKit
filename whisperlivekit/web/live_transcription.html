<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transkripsi Audio Langsung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            color: #7f8c8d;
            font-weight: 400;
        }

        .controls-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        #recordButton {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.3);
        }

        #recordButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(238, 90, 36, 0.4);
        }

        #recordButton.recording {
            width: 220px;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 25px;
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.3);
        }

        #recordButton:active {
            transform: scale(0.95);
        }

        #recordButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .shape-container {
            width: 20px;
            height: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .recording .shape {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .recording-info {
            display: none;
            align-items: center;
            gap: 15px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .recording .recording-info {
            display: flex;
        }

        .wave-container {
            width: 70px;
            height: 35px;
            position: relative;
        }

        #waveCanvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            min-width: 45px;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .setting-group select,
        .setting-group input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
            background: white;
        }

        .setting-group select:focus,
        .setting-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        #status {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            color: #2c3e50;
            backdrop-filter: blur(5px);
        }

        .speaker-boxes-header {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .speaker-boxes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .speaker-box {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
            color: #2c3e50;
            border: 2px solid transparent;
        }

        .speaker-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .speaker-box.active {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-color: #2980b9;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .transcript-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .transcript-header {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        #linesTranscript {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #2c3e50;
        }

        .line {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-left: 4px solid #3498db;
        }

        .line.final {
            background: rgba(52, 152, 219, 0.1);
            border-left-color: #27ae60;
        }

        .line.apercu {
            color: #7f8c8d;
            font-style: italic;
            background: rgba(127, 140, 141, 0.1);
            border-left-color: #95a5a6;
        }

        /* Recording Management Styles */
        .recordings-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .recordings-header {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recordings-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .recording-item {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
        }

        .recording-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .recording-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .recording-meta {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .recording-transcription {
            font-size: 0.9rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-style: italic;
            max-height: 60px;
            overflow: hidden;
        }

        .recording-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        .no-recordings {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-style: italic;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Transkripsi Audio Langsung</h1>
            <p>Klik tombol untuk memulai transkripsi audio real-time</p>
        </div>

        <div class="controls-section">
            <button id="recordButton">
                <div class="shape-container">
                    <div class="shape"></div>
                </div>
                <div class="recording-info">
                    <div class="wave-container">
                        <canvas id="waveCanvas"></canvas>
                    </div>
                    <div class="timer">00:00</div>
                </div>
            </button>
            
            <div class="settings-panel">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label for="chunkSelector">Ukuran Chunk (ms):</label>
                        <select id="chunkSelector">
                            <option value="500">500 ms</option>
                            <option value="1000" selected>1000 ms</option>
                            <option value="2000">2000 ms</option>
                            <option value="3000">3000 ms</option>
                            <option value="4000">4000 ms</option>
                            <option value="5000">5000 ms</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="websocketInput">URL WebSocket:</label>
                        <input id="websocketInput" type="text" />
                    </div>
                </div>
            </div>
        </div>

        <div id="status">Klik tombol untuk memulai transkripsi</div>

        <div class="speaker-boxes-container">
            <div class="speaker-boxes-header">🎤 Speaker Boxes <span id="active-speaker-status" style="font-size: 0.8rem; color: #7f8c8d; font-weight: normal;">(Klik untuk test)</span></div>
            <div class="speaker-boxes-grid">
                <div class="speaker-box speaker-1" data-speaker="1">S1</div>
                <div class="speaker-box speaker-2" data-speaker="2">S2</div>
                <div class="speaker-box speaker-3" data-speaker="3">S3</div>
                <div class="speaker-box speaker-4" data-speaker="4">S4</div>
                <div class="speaker-box speaker-5" data-speaker="5">S5</div>
                <div class="speaker-box speaker-6" data-speaker="6">S6</div>
                <div class="speaker-box speaker-7" data-speaker="7">S7</div>
            </div>
        </div>

        <div class="transcript-container">
            <div class="transcript-header">📝 Hasil Transkripsi</div>
            <div id="linesTranscript"></div>
        </div>

        <!-- Recording Management Section -->
        <div class="recordings-section">
            <div class="recordings-header">
                <span>🎵 Rekaman Tersimpan</span>
                <button class="refresh-btn" onclick="loadRecordings()">🔄 Refresh</button>
            </div>
            <div id="recordingsList" class="recordings-list">
                <div class="loading">Memuat rekaman...</div>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let websocket = null;
        let recorder = null;
        let chunkDuration = 1000;
        let websocketUrl = "ws://localhost:8000/asr";
        let userClosing = false;
        let startTime = null;
        let timerInterval = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let waveCanvas = document.getElementById("waveCanvas");
        let waveCtx = waveCanvas.getContext("2d");
        let animationFrame = null;
        let waitingForStop = false;
        let lastReceivedData = null;
        let activeSpeaker = null;
        let speakerBoxes = {};
        waveCanvas.width = 70 * (window.devicePixelRatio || 1);
        waveCanvas.height = 35 * (window.devicePixelRatio || 1);
        waveCtx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

        const statusText = document.getElementById("status");
        const recordButton = document.getElementById("recordButton");
        const chunkSelector = document.getElementById("chunkSelector");
        const websocketInput = document.getElementById("websocketInput");
        const linesTranscriptDiv = document.getElementById("linesTranscript");
        const timerElement = document.querySelector(".timer");
        const recordingsList = document.getElementById("recordingsList");

        // Initialize speaker boxes
        document.querySelectorAll('.speaker-box').forEach(box => {
            const speakerId = box.getAttribute('data-speaker');
            speakerBoxes[speakerId] = box;
            
            // Add click event for testing speaker boxes
            box.addEventListener('click', () => {
                // For testing purposes - manually activate speaker
                updateActiveSpeaker(speakerId);
                console.log(`Manually activated speaker ${speakerId}`);
            });
        });

        const host = window.location.hostname || "localhost";
        const port = window.location.port;
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const defaultWebSocketUrl = `${protocol}://${host}:${port}/asr`;
        websocketInput.value = defaultWebSocketUrl;
        websocketUrl = defaultWebSocketUrl;

        chunkSelector.addEventListener("change", () => {
            chunkDuration = parseInt(chunkSelector.value);
        });

        websocketInput.addEventListener("change", () => {
            const urlValue = websocketInput.value.trim();
            if (!urlValue.startsWith("ws://") && !urlValue.startsWith("wss://")) {
                statusText.textContent = "URL WebSocket tidak valid (harus dimulai dengan ws:// atau wss://)";
                return;
            }
            websocketUrl = urlValue;
            statusText.textContent = "URL WebSocket diperbarui. Siap untuk terhubung.";
        });

        function setupWebSocket() {
            return new Promise((resolve, reject) => {
                try {
                    websocket = new WebSocket(websocketUrl);
                } catch (error) {
                    statusText.textContent = "URL WebSocket tidak valid. Silakan periksa dan coba lagi.";
                    reject(error);
                    return;
                }

                websocket.onopen = () => {
                    statusText.textContent = "Terhubung ke server.";
                    resolve();
                };

                websocket.onclose = () => {
                    // Clear active speaker when connection closes
                    updateActiveSpeaker(null);
                    
                    if (!userClosing) {
                        statusText.textContent = "Koneksi terputus. Silakan coba lagi.";
                        console.log("WebSocket connection closed unexpectedly.");
                    }
                };

                websocket.onerror = (error) => {
                    statusText.textContent = "Error koneksi WebSocket.";
                    console.error("WebSocket error:", error);
                    reject(error);
                };

                websocket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        console.error("Error parsing WebSocket message:", error);
                    }
                };
            });
        }

        function handleWebSocketMessage(data) {
            if (data.type === "ready_to_stop") {
                console.log("Received ready_to_stop signal");
                waitingForStop = false;
                return;
            }

            if (data.lines && data.lines.length > 0) {
                updateTranscript(data.lines);
            }

            if (data.buffer_transcription) {
                updateBufferTranscription(data.buffer_transcription);
            }

            if (data.buffer_diarization) {
                updateDiarization(data.buffer_diarization);
            }

            if (data.remaining_time_transcription !== undefined) {
                console.log(`Transcription remaining time: ${data.remaining_time_transcription}s`);
            }

            if (data.remaining_time_diarization !== undefined) {
                console.log(`Diarization remaining time: ${data.remaining_time_diarization}s`);
            }

            if (data.status) {
                statusText.textContent = data.status;
            }
        }

        function updateTranscript(lines) {
            linesTranscriptDiv.innerHTML = "";
            
            lines.forEach(line => {
                const lineDiv = document.createElement("div");
                lineDiv.className = `line ${line.final ? 'final' : 'apercu'}`;
                
                const speakerSpan = document.createElement("span");
                speakerSpan.style.fontWeight = "bold";
                speakerSpan.style.color = "#3498db";
                speakerSpan.textContent = `S${line.speaker || '?'}: `;
                
                const textSpan = document.createElement("span");
                textSpan.textContent = line.text;
                
                lineDiv.appendChild(speakerSpan);
                lineDiv.appendChild(textSpan);
                linesTranscriptDiv.appendChild(lineDiv);
            });
            
            linesTranscriptDiv.scrollTop = linesTranscriptDiv.scrollHeight;
        }

        function updateBufferTranscription(text) {
            if (!text) return;
            
            const bufferDiv = document.createElement("div");
            bufferDiv.className = "line apercu";
            bufferDiv.textContent = `Buffer: ${text}`;
            
            // Remove previous buffer line if exists
            const existingBuffer = linesTranscriptDiv.querySelector(".line.apercu");
            if (existingBuffer) {
                existingBuffer.remove();
            }
            
            linesTranscriptDiv.appendChild(bufferDiv);
            linesTranscriptDiv.scrollTop = linesTranscriptDiv.scrollHeight;
        }

        function updateDiarization(text) {
            if (!text) return;
            console.log("Diarization:", text);
        }

        function updateActiveSpeaker(speakerId) {
            // Remove active class from all speaker boxes
            document.querySelectorAll('.speaker-box').forEach(box => {
                box.classList.remove('active');
            });
            
            // Add active class to current speaker
            if (speakerId && speakerBoxes[speakerId]) {
                speakerBoxes[speakerId].classList.add('active');
                activeSpeaker = speakerId;
            } else {
                activeSpeaker = null;
            }
        }

        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function drawWaveform() {
            if (!analyser) return;
            
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            
            const barWidth = (waveCanvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;
            
            for (let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 2;
                waveCtx.fillRect(x, waveCanvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
            
            animationFrame = requestAnimationFrame(drawWaveform);
        }

        function updateUI() {
            if (isRecording) {
                recordButton.classList.add("recording");
                recordButton.disabled = false;
            } else {
                recordButton.classList.remove("recording");
                recordButton.disabled = false;
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                recorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
                recorder.ondataavailable = (e) => {
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        websocket.send(e.data);
                    }
                };
                recorder.start(chunkDuration);
                
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                drawWaveform();
                
                isRecording = true;
                updateUI();
            } catch (err) {
                statusText.textContent = "Error mengakses mikrofon. Silakan izinkan akses mikrofon.";
                console.error(err);
            }
        }

        async function stopRecording() {
            userClosing = true;
            waitingForStop = true;
            
            // Clear active speaker when stopping
            updateActiveSpeaker(null);
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                // Send empty audio buffer as stop signal
                const emptyBlob = new Blob([], { type: 'audio/webm' });
                websocket.send(emptyBlob);
                statusText.textContent = "Rekaman dihentikan. Memproses audio terakhir...";
            }
            
            if (recorder) {
                recorder.stop();
                recorder = null;
            }
            
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            
            if (analyser) {
                analyser = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                try {
                    audioContext.close();
                } catch (e) {
                    console.warn("Could not close audio context:", e);
                }
                audioContext = null;
            }
            
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }            
            timerElement.textContent = "00:00";
            startTime = null;
            
            isRecording = false;
            updateUI();
            
            // Load recordings after stopping
            setTimeout(() => {
                loadRecordings();
            }, 1000);
        }

        async function toggleRecording() {
            if (!isRecording) {
                if (waitingForStop) {
                    console.log("Waiting for stop, early return");
                    return;  // Early return, UI is already updated
                }
                console.log("Connecting to WebSocket");
                try {
                    // If we have an active WebSocket that's still processing, just restart audio capture
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        await startRecording();
                    } else {
                        // If no active WebSocket or it's closed, create new one
                        await setupWebSocket();
                        await startRecording();
                    }
                } catch (err) {
                    statusText.textContent = "Tidak dapat terhubung ke WebSocket atau mengakses mikrofon. Dibatalkan.";
                    console.error(err);
                }
            } else {
                console.log("Stopping recording");
                stopRecording();
            }
        }

        recordButton.addEventListener("click", toggleRecording);

        // Recording Management Functions
        async function loadRecordings() {
            try {
                recordingsList.innerHTML = '<div class="loading">Memuat rekaman...</div>';
                
                const response = await fetch('/api/recordings');
                if (!response.ok) {
                    throw new Error('Failed to load recordings');
                }
                
                const recordings = await response.json();
                
                if (recordings.length === 0) {
                    recordingsList.innerHTML = '<div class="no-recordings">Belum ada rekaman tersimpan</div>';
                    return;
                }
                
                recordingsList.innerHTML = '';
                
                recordings.forEach(recording => {
                    const recordingItem = createRecordingItem(recording);
                    recordingsList.appendChild(recordingItem);
                });
                
            } catch (error) {
                console.error('Error loading recordings:', error);
                recordingsList.innerHTML = '<div class="no-recordings">Error memuat rekaman</div>';
            }
        }

        function createRecordingItem(recording) {
            const item = document.createElement('div');
            item.className = 'recording-item';
            
            const duration = recording.duration ? formatDuration(recording.duration) : 'Unknown';
            const fileSize = recording.file_size ? formatFileSize(recording.file_size) : 'Unknown';
            const createdAt = new Date(recording.created_at).toLocaleString('id-ID');
            
            item.innerHTML = `
                <div class="recording-title">${recording.title || 'Untitled Recording'}</div>
                <div class="recording-meta">
                    Duration: ${duration} | Size: ${fileSize} | Created: ${createdAt}
                </div>
                ${recording.transcription ? `<div class="recording-transcription">"${recording.transcription.substring(0, 100)}${recording.transcription.length > 100 ? '...' : ''}"</div>` : ''}
                <div class="recording-actions">
                    <button class="btn btn-primary" onclick="playRecording(${recording.id})">▶️ Play</button>
                    <button class="btn btn-success" onclick="downloadRecording(${recording.id})">⬇️ Download</button>
                    <button class="btn btn-danger" onclick="deleteRecording(${recording.id})">🗑️ Delete</button>
                </div>
                <audio id="audio-${recording.id}" class="audio-player" controls style="display: none;">
                    <source src="/api/recordings/${recording.id}/download" type="audio/wav">
                    Your browser does not support the audio element.
                </audio>
            `;
            
            return item;
        }

        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function playRecording(recordingId) {
            const audio = document.getElementById(`audio-${recordingId}`);
            if (audio) {
                audio.style.display = 'block';
                audio.play();
            }
        }

        function downloadRecording(recordingId) {
            window.open(`/api/recordings/${recordingId}/download`, '_blank');
        }

        async function deleteRecording(recordingId) {
            if (!confirm('Are you sure you want to delete this recording?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/recordings/${recordingId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadRecordings(); // Reload the list
                } else {
                    alert('Failed to delete recording');
                }
            } catch (error) {
                console.error('Error deleting recording:', error);
                alert('Error deleting recording');
            }
        }

        // Load recordings when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadRecordings();
        });
    </script>
</body>

</html>
